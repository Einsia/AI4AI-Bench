# clip, from the pinned openai/CLIP commit. Not on any index -- CLIP has no PyPI release
# -- so this line cannot come from the operator wheelhouse resolver, which resolves
# against one: `--only-binary :all:` and a VCS requirement are mutually exclusive, and the
# report pip writes for a VCS requirement carries a git+ URL and no archive hash.
#
# Built from the pinned commit with git supplied by the build context:
#
#   pip wheel --no-deps --no-build-isolation \
#     git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33
#
# --no-build-isolation on purpose: CLIP's setup.py imports pkg_resources and clip/clip.py:6
# does `from pkg_resources import packaging`, which setuptools 81 removed, so the wheel is
# built against the base's own setuptools rather than whatever an isolated build environment
# would fetch.
#
# Installed --no-deps. Its requirements are ftfy, regex, tqdm, torch and torchvision; the
# first two are the lines above and the last three come from the base. `pip check`
# validates the combined environment during the build.
clip==1.0 \
    --hash=sha256:94fc15541052cf3c2ba12295d83c3df0ed17568fcec49b783e1dd04fd91a9898

# setuptools is a PIN, not a dependency, and it is here because CLIP imports a module
# setuptools deleted. clip/clip.py:6 is `from pkg_resources import packaging`; pkg_resources
# was removed in setuptools 81. The base ships 79.0.1, which still has it (measured: it
# imports, with a DeprecationWarning, and packaging.version.parse works).
#
# Pinning it converts that from a coincidence into a checked fact. Without this line the
# task depends on the base image's setuptools happening to be old enough, which is exactly
# the class of dependency that breaks quietly when a base is refreshed -- and the failure
# would surface as CLIP failing to import, four steps away from its cause.
#
# It also cannot be produced by the operator wheelhouse resolver: `pip install --dry-run`
# against the base reports setuptools as already satisfied and omits it from the plan, so
# this wheel was fetched explicitly by `pip download setuptools==79.0.1`.
setuptools==79.0.1 \
    --hash=sha256:e147c0549f27767ba362f9da434eab9c5dc0045d5304feb602a0af001089fc51
