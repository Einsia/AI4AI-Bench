    file_sha256: 966193d8d22e279e0055016566f0879b929748c29cba018b5db52981a8d88cfa
    schema: prompt[0].content, reward_model.ground_truth
    mount: /assets/data/math500
    phases: [explore]
    materialize:
      sources:
        math500:
          tool: git_archive
          repository: https://github.com/thunlp/JustRL.git
          revision: cf444e9920b599c865ee6742c88dc162dcabcec2
          member: data/MATH-500/test.parquet
          destination: test.parquet
    note: >-
      fast_eval reads all 500 at 4 samples. Same tar as the grader, so
      fast_eval and the final share one schema and one scoring path.

  data/aime:
