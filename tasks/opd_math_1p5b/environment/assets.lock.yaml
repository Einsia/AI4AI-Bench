schema_version: 2
task_id: opd_math_1p5b

# Every path here is an alias. A deployment profile maps aliases onto real
# directories, so the repository carries no host layout.
path_policy: repo_relative_aliases

build_contexts:
  network: none
  # verl is the submodule at environment/verl. The other two are materialized on
  # the host: a JustRL tree at the pinned commit, and a wheel directory.
  names: [verl_source, justrl_source, wheelhouse, agent_tools]
  reproducibility: >-
    two network-disabled no-cache builds must have identical normalized task
    filesystem manifests. BuildKit may serialize that identical filesystem into
    different raw layer tar orderings; select one attested build, record its layer
    fingerprint, and distribute that exact docker-save archive to every run host

assets:
  agent_tools:
    kind: binary_context
    files:
      rg:
        source: https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
        version: 14.1.1
        archive_sha256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
        archive_member: ripgrep-14.1.1-x86_64-unknown-linux-musl/rg
        sha256: f401154e2393f9002ac77e419f9ee5521c18f4f8cd3e32293972f493ba06fce7
    note: >-
      Official release asset. The extracted binary is supplied through the agent_tools
      build context and checked during image build.

  verl_source:
    kind: git_repository
    source: https://github.com/volcengine/verl.git
    revision: 7aed6b230776f963fa09509c10d9c3a767d1102c
    submodule: environment/verl
    license: Apache-2.0
    git_tree: 7379af39e186ee4eafeb7225f1120d1409b48ced
    content_sha256: 9d91e58e8ee61713449c95056a5b573e463a811a64fc8ac2eae296123a5db0ad
    hash_kind: tree_manifest_sha256
    expected_files: 1015
    size_bytes: 8356721
    patch: environment/single_gpu_wall_clock.patch
    download:
      tool: git_archive
      repository: https://github.com/volcengine/verl.git
      revision: 7aed6b230776f963fa09509c10d9c3a767d1102c
      exclude_git_metadata: true
      nested_submodules: deliberately_absent
    note: >-
      The tree that actually executes. It carries trainer/distillation, which
      OPD's own bundled verl does not -- which is why that submodule was dropped.
      The unrelated `recipe` nested submodule is not part of this build context;
      export the pinned superproject tree rather than recursively copying a clone.

  justrl_source:
    kind: git_repository
    source: https://github.com/thunlp/JustRL.git
    revision: cf444e9920b599c865ee6742c88dc162dcabcec2
    license: not-declared-at-repository-root
    license_review: train/LICENSE covers only the train subtree; review grader/data terms
    content_sha256: a2b11b8976914727fe2f5262b00ada8fca662d2675d3c3fca5a862ec8c0e242d
    hash_kind: tree_manifest_sha256
    expected_files: 603
    size_bytes: 6111748
    download:
      tool: git_archive
      repository: https://github.com/thunlp/JustRL.git
      revision: cf444e9920b599c865ee6742c88dc162dcabcec2
      exclude_git_metadata: true
    used_for:
      - evals/utils.py -> the rule grader, baked into /opt/harness/justrl
      - evals/grade.py -> CV_PROMPT for the CompassVerifier fallback
      - data/MATH-500/test.parquet -> mounted as data/math500 for fast_eval
    note: >-
      Grader code is baked into the image rather than mounted. That is what makes
      "the evaluator does not change" checkable by reading one Dockerfile.

  models/student:
    kind: model
    source: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    revision: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
    license: MIT
    content_sha256: d10e557e5097f5c1b5c2d70b4de0cee3eb96f170125cfcc68a922ab25083c7e5
    hash_kind: tree_manifest_sha256
    size_bytes: 3562046103
