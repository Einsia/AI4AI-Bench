    revision: 0637e4096c789c67f9eecbe8355e0bdeddede1c2
    license: Apache-2.0
    content_sha256: b45f3351510c8042bc1dfc1e621e15e0d6fbdc8d201bb663786f92db23d5cadd
    hash_kind: tree_manifest_sha256
    size_bytes: 3561656216
    mount: /assets/models/teacher
