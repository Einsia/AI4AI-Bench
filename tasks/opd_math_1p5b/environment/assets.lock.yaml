    file_sha256:
      aime2024/data/train-00000-of-00001.parquet: 025484a99fea498e7d0c3b0ee42afcbec0176405c19c5dbf557b9f6ca6445675
      aime2025/aime2025-I.jsonl: b91b3c96f05d9635d2a0692b124ebe023c1ff59cb19c074275e6c4b349d0659e
      aime2025/aime2025-II.jsonl: 16a2dcfbbf9db1b11f8a69a3ba5e4cac73e3641b19a37e2307e9c12240bbed5e
