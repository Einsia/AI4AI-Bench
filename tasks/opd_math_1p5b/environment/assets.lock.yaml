  models/verifier:
    kind: model
    source: opencompass/CompassVerifier-3B
    # The immutable Hub revision is recorded alongside the content hash.
    revision: 27d6d660bdf6c2b8a9f45906d4b76c508af65ab0
    revision_last_modified: "2026-01-04T06:26:02Z"
