    hash_kind: tree_manifest_sha256
    mount: /assets/models/verifier
    phases: [score]
    note: fallback judge for the rows the rule grader rejects

  data/train.parquet:
    kind: derived_dataset
    source: BytedTsinghua-SIA/DAPO-Math-17k
    source_revision: 65877096c24ffa7abc4e4fa5edb95cf3413a5674
    source_file: data/dapo-math-17k.parquet
    source_file_sha256: 534375d6bb8630d22ab46a56e11f2ffec1d288d8f7d04099bc82d68948705941
    source_rows: 1791700
    canonical_unique_rows: 16395
    derivation_revision: opd-aime-zero-overlap-v2
    materialization_revision: opd-aime-zero-overlap-v2-pyarrow23-public-source-v1
    license: Apache-2.0
    content_sha256: c597e3857f5754a338c007e420909da562eca61f5ceb0ecf8a1200f0e5dc6e19
    hash_kind: file_sha256
    expected_rows: 15285
    size_bytes: 1663791
    mount: /assets/data/train.parquet
    phases: [explore, retrain]
    derivation: >-
      canonical deduplication of the complete 1,791,700-row public source to
      16,395 unique prompts, then removal of canonical, containment and shared
      eight-word overlap against the pinned AIME24/25 snapshots, followed by an
      80-row deterministic holdout. Zero post-filter overlap with the final
      questions; 15,285 training rows remain.
    serialization:
      format: parquet
      pyarrow: "23.0.1"
      compression: zstd
      compression_level: 9
    materialize:
      sources:
        dapo:
          tool: huggingface_hub.snapshot_download
          repo_type: dataset
          repo_id: BytedTsinghua-SIA/DAPO-Math-17k
          revision: 65877096c24ffa7abc4e4fa5edb95cf3413a5674
        aime:
          alias: data/aime
      builder:
        type: task_image
        image: docker.io/chiyizhe/ai4ai@sha256:87c4dbbd1216502c6e18c893b77b37ea3b1d0becd7b08ee9d2514193a198a8f6
        script: tools/asset_builders/build_opd_zero_overlap.py
        script_sha256: 413be279142b64a7d0d7eeb00637d0e9cdf2696df354567bd2792bb5ad0cce82
        command:
          - python3
          - /builder/repo/tools/asset_builders/build_opd_zero_overlap.py
          - --dapo
          - "{source:dapo}"
          - --aime
          - "{alias:data/aime}"
          - --output
          - "{output}"

  data/math500:
    kind: dataset
    source: JustRL@cf444e9920b599c865ee6742c88dc162dcabcec2 data/MATH-500/test.parquet
    expected_rows: 500
    content_sha256: b009ef8dcb86ab687a104b8efb52080fd8ae14f32cc4a52447a3518461aa32c1
    hash_kind: tree_manifest_sha256
